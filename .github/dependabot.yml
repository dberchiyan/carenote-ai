version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/api"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    groups:
      javascript:
        patterns: ["*"]
  - package-ecosystem: "docker"
    directory: "/api"
    schedule:
      interval: "monthly"
  - package-ecosystem: "docker"
    directory: "/web"
    schedule:
      interval: "monthly"
